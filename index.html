<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ehsan Games - Explore the Depth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; text-align: center; }
    
    /* Sticky Counter UI */
    #depth-hud {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: bold;
      font-size: 1.2rem;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* Long Scroll Container */
    .container {
      height: 4000px; /* Makes the page scrollable */
      background: linear-gradient(180deg, #0b0f19 0%, #1a233a 30%, #0d1b2a 70%, #02040a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 100px 20px;
    }

    .hero { margin-top: 100px; max-width: 600px; }
    h1 { font-size: 3rem; margin-bottom: 10px; }
    p { font-size: 1.2rem; color: #a0aec0; }
    
    .section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
    }

    .footer { margin-bottom: 40px; }
  </style>
</head>
<body>

  <!-- Sticky Depth Counter -->
  <div id="depth-hud">Depth: <span id="depth-val">0</span>m</div>

  <div class="container">
    <div class="hero">
      <h1>Ehsan Games</h1>
      <p>Scroll down to explore interactive visual depth projects.</p>
    </div>

    <div class="section">
      <h2>🎮 Project 1: Most Popular Games</h2>
      <p>Coming Soon...</p>
    </div>

    <div class="section">
      <h2>🎬 Project 2: Global Movies</h2>
      <p>Coming Soon...</p>
    </div>

    <div class="footer">
      <h2>You reached the bottom!</h2>
      <p>More updates dropping tomorrow.</p>
    </div>
  </div>

  <script>
    // Live Depth Meter Script
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      document.getElementById('depth-val').innerText = Math.floor(scrollY / 4);
    });
  </script>
</body>
</html>
