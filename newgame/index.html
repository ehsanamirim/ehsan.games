<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Tic-Tac-Toe | Ehsan Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .status {
      font-size: 1.2rem;
      color: #94a3b8;
      min-height: 28px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .cell {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
      user-select: none;
    }
    .cell:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
    .cell.x {
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .cell.o {
      color: #f43f5e;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.5);
    }
    .controls {
      margin-top: 28px;
      display: flex;
      gap: 12px;
    }
    button {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }
    .back-link {
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Cyber Tic-Tac-Toe</h1>
    <div class="status" id="status">Player X's turn</div>
  </div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="controls">
    <button onclick="resetGame()">Reset Game</button>
  </div>

  <a href="/" class="back-link">&larr; Back to Main Hub</a>

  <script>
    let boardState = Array(9).fill('');
    let currentPlayer = 'X';
    let isGameActive = true;

    const statusDisplay = document.getElementById('status');
    const cells = document.querySelectorAll('.cell');

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    function handleCellClick(e) {
      const clickedCell = e.target;
      const index = parseInt(clickedCell.getAttribute('data-index'));

      if (boardState[index] !== '' || !isGameActive) return;

      boardState[index] = currentPlayer;
      clickedCell.innerText = currentPlayer;
      clickedCell.classList.add(currentPlayer.toLowerCase());

      checkResult();
    }

    function checkResult() {
      let roundWon = false;

      for (let condition of winningConditions) {
        let a = boardState[condition[0]];
        let b = boardState[condition[1]];
        let c = boardState[condition[2]];

        if (a === '' || b === '' || c === '') continue;

        if (a === b && b === c) {
          roundWon = true;
          break;
        }
      }

      if (roundWon) {
        statusDisplay.innerText = `Player ${currentPlayer} Wins! 🎉`;
        isGameActive = false;
        return;
      }

      if (!boardState.includes('')) {
        statusDisplay.innerText = `It's a Draw! 👔`;
        isGameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusDisplay.innerText = `Player ${currentPlayer}'s turn`;
    }

    function resetGame() {
      boardState = Array(9).fill('');
      isGameActive = true;
      currentPlayer = 'X';
      statusDisplay.innerText = `Player X's turn`;

      cells.forEach(cell => {
        cell.innerText = '';
        cell.classList.remove('x', 'o');
      });
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
  </script>
</body>
</html>
